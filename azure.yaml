name: enterprise-demo-app
metadata:
  template: enterprise-demo-app@0.0.1
infra:
  provider: bicep
  path: ./infra
  module: main
hooks:
  postprovision:
    posix:
      shell: sh
      run: bash scripts/post-provision.sh
      interactive: false
      continueOnError: true
      env:
        GITHUB_APP_PEM_FILE: ${GITHUB_APP_PEM_FILE}
