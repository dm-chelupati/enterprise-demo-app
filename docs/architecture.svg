<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#555"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.2"/></filter>
  </defs>

  <rect width="800" height="480" rx="12" fill="#0d1117"/>

  <!-- VNet -->
  <rect x="30" y="30" width="740" height="360" rx="16" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="50" y="55" fill="#58a6ff" font-size="13" font-weight="600">Private VNet</text>

  <!-- AKS -->
  <rect x="60" y="80" width="280" height="180" rx="12" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" filter="url(#s)"/>
  <text x="200" y="108" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">AKS (Private)</text>

  <rect x="85" y="125" width="100" height="45" rx="8" fill="#1c2333" stroke="#238636" stroke-width="1.5"/>
  <circle cx="98" cy="142" r="4" fill="#238636"/>
  <text x="140" y="148" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Storefront</text>

  <rect x="215" y="125" width="100" height="45" rx="8" fill="#1c2333" stroke="#238636" stroke-width="1.5"/>
  <circle cx="228" cy="142" r="4" fill="#238636"/>
  <text x="265" y="148" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">API</text>

  <line x1="185" y1="147" x2="215" y2="147" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="100" y="195" width="75" height="28" rx="6" fill="#1c2333" stroke="#6e40c9" stroke-width="1"/>
  <text x="137" y="214" text-anchor="middle" fill="#d2a8ff" font-size="9" font-weight="600">LB :80</text>
  <line x1="137" y1="195" x2="137" y2="170" stroke="#6e40c9" stroke-width="1" marker-end="url(#a)"/>

  <!-- PostgreSQL -->
  <rect x="420" y="80" width="180" height="75" rx="12" fill="#161b22" stroke="#da8e35" stroke-width="1.5" filter="url(#s)"/>
  <text x="510" y="110" text-anchor="middle" fill="#da8e35" font-size="14" font-weight="700">PostgreSQL</text>
  <text x="510" y="130" text-anchor="middle" fill="#8b949e" font-size="10">VNet-delegated · Private</text>

  <line x1="315" y1="147" x2="420" y2="118" stroke="#da8e35" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- AMPLS -->
  <rect x="420" y="200" width="330" height="130" rx="12" fill="#161b22" stroke="#f78166" stroke-width="1.5" filter="url(#s)"/>
  <text x="585" y="228" text-anchor="middle" fill="#f78166" font-size="13" font-weight="700">AMPLS (Private Link)</text>

  <rect x="450" y="250" width="80" height="35" rx="6" fill="#1c2333" stroke="#bc8cff" stroke-width="1"/>
  <text x="490" y="272" text-anchor="middle" fill="#bc8cff" font-size="10">App Insights</text>

  <rect x="560" y="250" width="60" height="35" rx="6" fill="#1c2333" stroke="#bc8cff" stroke-width="1"/>
  <text x="590" y="272" text-anchor="middle" fill="#bc8cff" font-size="10">LAW</text>

  <text x="585" y="310" text-anchor="middle" fill="#8b949e" font-size="9">Private ingestion + query</text>

  <path d="M 265 170 L 265 270 L 450 270" fill="none" stroke="#f78166" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#a)"/>

  <!-- External row -->
  <text x="50" y="425" fill="#8b949e" font-size="10" letter-spacing="0.05em">EXTERNAL</text>

  <rect x="120" y="410" width="80" height="30" rx="6" fill="#1c2333" stroke="#6e40c9" stroke-width="1"/>
  <text x="160" y="430" text-anchor="middle" fill="#d2a8ff" font-size="10">Users</text>

  <rect x="230" y="410" width="90" height="30" rx="6" fill="#1c2333" stroke="#f0f6fc" stroke-width="1"/>
  <text x="275" y="430" text-anchor="middle" fill="#f0f6fc" font-size="10">GitHub</text>

  <rect x="345" y="410" width="95" height="30" rx="6" fill="#1c2333" stroke="#81b5f0" stroke-width="1"/>
  <text x="392" y="430" text-anchor="middle" fill="#81b5f0" font-size="10">ServiceNow</text>

  <rect x="465" y="410" width="90" height="30" rx="6" fill="#1c2333" stroke="#1aad1a" stroke-width="1"/>
  <text x="510" y="430" text-anchor="middle" fill="#1aad1a" font-size="10">Dynatrace</text>

  <rect x="580" y="410" width="60" height="30" rx="6" fill="#1c2333" stroke="#2684ff" stroke-width="1"/>
  <text x="610" y="430" text-anchor="middle" fill="#2684ff" font-size="10">Jira</text>

  <line x1="160" y1="410" x2="137" y2="260" stroke="#6e40c9" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
</svg>
