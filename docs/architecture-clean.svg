<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#94a3b8"/></marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="440" rx="8" fill="#f8fafc"/>

  <!-- VNet boundary -->
  <rect x="24" y="24" width="732" height="310" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="36" y="16" width="100" height="20" rx="4" fill="#f8fafc"/>
  <text x="86" y="30" text-anchor="middle" fill="#475569" font-size="11" font-weight="600">Private VNet</text>

  <!-- AKS -->
  <rect x="50" y="60" width="220" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="86" text-anchor="middle" fill="#1e40af" font-size="14" font-weight="700">AKS</text>
  <text x="160" y="102" text-anchor="middle" fill="#64748b" font-size="10">Private cluster</text>

  <rect x="70" y="118" width="80" height="36" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="84" cy="136" r="4" fill="#22c55e"/>
  <text x="118" y="140" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="600">Storefront</text>

  <rect x="170" y="118" width="80" height="36" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="184" cy="136" r="4" fill="#22c55e"/>
  <text x="218" y="140" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="600">API</text>

  <line x1="150" y1="136" x2="170" y2="136" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- PostgreSQL -->
  <rect x="340" y="95" width="170" height="70" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="425" y="125" text-anchor="middle" fill="#854d0e" font-size="14" font-weight="700">PostgreSQL</text>
  <text x="425" y="143" text-anchor="middle" fill="#64748b" font-size="10">Private · VNet-delegated</text>

  <!-- Arrow API → PG (straight horizontal) -->
  <line x1="250" y1="136" x2="340" y2="132" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- AMPLS -->
  <rect x="340" y="210" width="390" height="100" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="535" y="238" text-anchor="middle" fill="#6b21a8" font-size="13" font-weight="700">Azure Monitor Private Link</text>

  <rect x="370" y="255" width="100" height="32" rx="6" fill="#fff" stroke="#a855f7" stroke-width="1"/>
  <text x="420" y="276" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="600">App Insights</text>

  <rect x="500" y="255" width="60" height="32" rx="6" fill="#fff" stroke="#a855f7" stroke-width="1"/>
  <text x="530" y="276" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="600">LAW</text>

  <text x="535" y="300" text-anchor="middle" fill="#94a3b8" font-size="9">Private ingestion + query</text>

  <!-- Arrow API → AMPLS telemetry -->
  <path d="M 210 154 L 210 270 L 370 270" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- External services row -->
  <rect x="50" y="370" width="125" height="36" rx="8" fill="#fff" stroke="#1e293b" stroke-width="1.2"/>
  <text x="112" y="393" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">GitHub Enterprise</text>

  <rect x="200" y="370" width="100" height="36" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="1.2"/>
  <text x="250" y="393" text-anchor="middle" fill="#0369a1" font-size="11" font-weight="600">ServiceNow</text>

  <rect x="325" y="370" width="90" height="36" rx="8" fill="#fff" stroke="#22c55e" stroke-width="1.2"/>
  <text x="370" y="393" text-anchor="middle" fill="#166534" font-size="11" font-weight="600">Dynatrace</text>

  <rect x="440" y="370" width="60" height="36" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="470" y="393" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="600">Jira</text>
</svg>
